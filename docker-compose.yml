# =============================================================================
# SILAB — dijalankan di satu mini PC / laptop bekas di dalam laboratorium.
#
# Sifat lokal server inilah mekanisme keamanannya: kalau seseorang tidak berada
# di jangkauan WiFi lab, ia tidak bisa mencapai halaman absensi sama sekali.
# Akses dari luar (dasbor, laporan) disediakan lewat Cloudflare Tunnel yang
# TIDAK boleh meneruskan /api/attendance maupun /display.
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Jakarta
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Tidak dipublikasikan ke jaringan: hanya aplikasi yang perlu bicara ke sini.
    expose:
      - "5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS}
      LAB_SUBNETS: ${LAB_SUBNETS}
      LAB_NETWORK_BYPASS: ${LAB_NETWORK_BYPASS:-false}
      QR_TOKEN_SECRET: ${QR_TOKEN_SECRET}
      QR_ROTATE_SECONDS: ${QR_ROTATE_SECONDS:-60}
      QR_MAX_AGE_SECONDS: ${QR_MAX_AGE_SECONDS:-90}
      CRON_SECRET: ${CRON_SECRET}
      TZ: Asia/Jakarta
    volumes:
      - uploads:/app/uploads
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      # Dibuka untuk PILIHAN B pada Caddyfile (https). Tidak berpengaruh
      # selama masih memakai PILIHAN A.
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Penjadwal internal: menerbitkan kode harian dan menandai pinjaman
  # yang lewat tenggat, tiap pukul 00:01 WIB.
  cron:
    image: alpine:3.20
    restart: unless-stopped
    depends_on:
      - app
    environment:
      CRON_SECRET: ${CRON_SECRET}
      ALAMAT_APLIKASI: http://app:3000
      TZ: Asia/Jakarta
    volumes:
      - ./scripts/cron.sh:/usr/local/bin/cron.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/cron.sh"]

  # Dump PostgreSQL harian, disimpan 30 hari terakhir (bagian 8 SPEC).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Jakarta
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
